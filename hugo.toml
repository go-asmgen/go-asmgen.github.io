baseURL = "https://go-asmgen.github.io/"
title = "go-asmgen"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[markup.goldmark.renderer]
  unsafe = true

[[params.targets]]
  name = "amd64"
  status = "ready"
  blurb = "Yes, amd64 too — for one uniform builder across every target. SSE float moves, sign/zero-extending sub-word loads. NEON/SSE SIMD via Raw."
  regs = "AX.. / X0.."
[[params.targets]]
  name = "arm64"
  status = "ready"
  blurb = "All ABI0 scalars + struct/slice/string aggregates, and NEON packed ops. The reference target; runtime-proven natively."
  regs = "R0.. / F0.."
[[params.targets]]
  name = "riscv64"
  status = "ready"
  blurb = "Same ABI0 layout as arm64, a different move table (MOV/MOVF/MOVD). Runtime-proven under qemu-user."
  regs = "X0.. / F0.."
[[params.targets]]
  name = "loong64"
  status = "ready"
  blurb = "LoongArch 64-bit — same shared ABI0 layout, a third move table (MOVV/MOVF/MOVD). Runtime-proven under qemu-user."
  regs = "R0.. / F0.."
[[params.targets]]
  name = "ppc64le"
  status = "ready"
  blurb = "POWER little-endian — same shared ABI0 layout, move table MOVD/FMOVS/FMOVD. VSX packed ops via Raw. Runtime-proven under qemu-user."
  regs = "R0.. / F0.."
[[params.targets]]
  name = "s390x"
  status = "ready"
  blurb = "IBM Z, big-endian — same shared ABI0 layout, move table MOVD/FMOVS/FMOVD. Vector-facility ops via Raw; the big-endian path is exercised. Runtime-proven under qemu-user."
  regs = "R0.. / F0.."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 4.88:1, bright on the dark background 9.94:1.
  base = "#0079a8"
  deep = "#004a66"
  bright = "#22cce2"
  shadow = "rgba(0,121,168,.7)"
  glow = "rgba(0,121,168,.6)"
  wash = "rgba(0,121,168,.10)"
  washDeep = "rgba(0,74,102,.06)"
  chipBg = "#e4f9fc"
  chipBorder = "#bdf0f6"
  chipFg = "#004a66"
  chipBgDark = "rgba(34,204,226,.14)"
  chipBorderDark = "rgba(34,204,226,.32)"
  chipFgDark = "#85e3ef"
  statsEnd = "#caf3f8"
  bandText = "#dcf7fa"
